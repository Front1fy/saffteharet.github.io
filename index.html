<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>saffteharet</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
*{box-sizing:border-box;}
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f4fbff;
    color:#222;
    transition:.3s;
}
body.light{background:#f4fbff;color:#222;}
body.dark{
    background:linear-gradient(135deg,#0a1a3b,#13264f,#1b3270);
    color:#fff;
}

/* HEADER */
.header{
    background:#2fa4aa;
    height:140px;
    border-bottom-left-radius:60% 35px;
    border-bottom-right-radius:70% 35px;
    position:relative;
}

/* THEME */
.theme-toggle{
    position:absolute;
    left:20px;
    top:35px;
    width:40px;height:40px;border-radius:50%;
    background:rgba(255,255,255,.25);
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
}
.theme-toggle i{color:#fff;font-size:18px;position:absolute;}
#moonIcon,#sunIcon{display:none;}
body.light #sunIcon{display:block;}
body.dark #moonIcon{display:block;}

/* LANG */
.lang-btn{
    position:absolute;
    right:25px;
    top:42px;
    width:35px;
    height:35px;
}
.lang-btn img{
    width:100%;
    height:100%;
    border-radius:50%;
}

/* LOGO WRAP */
.logo-wrap{
    position:absolute;
    left:50%;
    top:25px;
    transform:translateX(-50%);
    width:150px;
    height:150px;
}

/* LOGO */
.logo{
    width:100px;
    height:100px;
    background:#fff;
    border-radius:50%;
    position:absolute;
    left:50%;
    top:35px;
    transform:translateX(-50%);
    overflow:hidden;
    box-shadow:0 10px 25px rgba(0,0,0,.25);
}
.logo img{
    width:100%;
    height:100%;
    object-fit:cover;
}

/* CURVED TEXT */
.curved-text{
    position:absolute;
    top:0;
    left:0;
    width:150px;
    height:150px;
}
.curved-text text{
    fill:#fff;
    font-size:14px;
    font-weight:bold;
    letter-spacing:3px;
}

/* MAIN */
.menu-area{
    min-height:calc(100vh - 140px);
    display:flex;
    flex-direction:column;
    align-items:center;
    padding-top:90px;
    text-align:center;
}

/* STARS */
.stars{margin-top:20px;}
.stars i{
    color:#FFD700;
    font-size:22px;
    margin:0 2px;
    animation:twinkle 1.5s infinite alternate;
}
.stars i:nth-child(odd){animation-delay:.6s;}
@keyframes twinkle{
    from{opacity:.6;transform:scale(1);}
    to{opacity:1;transform:scale(1.2);}
}

.rating-text{
    margin-top:6px;
    font-size:14px;
    opacity:.9;
}

/* BUTTON */
.menu-btn{
    margin-top:24px;
    background:#2fa4aa;
    color:#fff;
    text-decoration:none;
    padding:18px 38px;
    border-radius:40px;
    font-size:18px;
    font-weight:bold;
    display:inline-flex;
    align-items:center;
    gap:10px;
    animation:pulseGlow 2s infinite;
}
.menu-btn i{animation:cleanMove 1.2s infinite alternate;}

@keyframes pulseGlow{
    0%{box-shadow:0 0 0 0 rgba(47,164,170,.7);}
    70%{box-shadow:0 0 0 18px rgba(47,164,170,0);}
    100%{box-shadow:0 0 0 0 rgba(47,164,170,0);}
}
@keyframes cleanMove{
    from{transform:rotate(-6deg);}
    to{transform:rotate(6deg);}
}

/* INFO BOX */
.info-box{
    margin-top:30px;
    background:rgba(255,255,255,.9);
    padding:18px;
    border-radius:16px;
    max-width:380px;
    box-shadow:0 8px 22px rgba(0,0,0,.15);
}
body.dark .info-box{background:rgba(30,30,30,.95);}
.info-box h4{
    margin:0 0 8px;
    font-size:16px;
    color:#2fa4aa;
}
.info-box p{
    margin:0;
    font-size:14px;
    line-height:1.6;
}

/* SOCIAL */
.socials{margin-top:16px;}
.socials a{
    display:inline-flex;
    width:44px;height:44px;
    border-radius:50%;
    background:#2fa4aa;
    color:#fff;
    margin:0 6px;
    font-size:20px;
    align-items:center;
    justify-content:center;
    text-decoration:none;
}
</style>
</head>

<body class="light">

<div class="header">

    <div class="theme-toggle" id="themeToggle">
        <i class="fas fa-moon" id="moonIcon"></i>
        <i class="fas fa-sun" id="sunIcon"></i>
    </div>

    <div class="lang-btn">
        <img src="ımg/images.png">
    </div>

    <!-- LOGO + CURVED TEXT -->
    <div class="logo-wrap">

        <svg class="curved-text" viewBox="0 0 200 200">
            <defs>
                <path id="curve"
                      d="M 20,120 A 80,80 0 0,1 180,120" />
            </defs>
            <text>
                <textPath href="#curve" startOffset="50%" text-anchor="middle">
                    SAFF TƏHARET
                </textPath>
            </text>
        </svg>

        <div class="logo">
            <img src="ımg/WhatsApp Image 2026-02-07 at 16.54.11.jpeg">
        </div>
    </div>

</div>

<div class="menu-area">

    <div class="stars">
        <i class="fas fa-star"></i>
        <i class="fas fa-star"></i>
        <i class="fas fa-star"></i>
        <i class="fas fa-star"></i>
        <i class="fas fa-star"></i>
    </div>

    <div class="rating-text">
        ⭐ 4.8 ortalama reytinq · 325 rəy
    </div>

    <a href="index(1).html" class="menu-btn">
        <i class="fas fa-broom"></i>
        Menyulara baxın
    </a>

    <div class="info-box">
        <h4>Şirkət haqqında</h4>
        <p>
            Təmizlik məhsulları sahəsində keyfiyyət və etibarlılığı
            əsas tutan şirkətimiz təhlükəsiz və effektiv həllər təqdim edir.
        </p>

        <div class="socials">
            <a href="https://wa.me/994501234567" target="_blank"><i class="fab fa-whatsapp"></i></a>
            <a href="https://www.instagram.com/saffteharet" target="_blank"><i class="fab fa-instagram"></i></a>
            <a href="https://www.tiktok.com/@saffteharet" target="_blank"><i class="fab fa-tiktok"></i></a>
        </div>
    </div>

</div>

<script>
const toggle=document.getElementById("themeToggle");
const bodyEl=document.body;

if(localStorage.getItem("theme")==="dark"){
    bodyEl.classList.replace("light","dark");
}
toggle.onclick=()=>{
    bodyEl.classList.toggle("dark");
    bodyEl.classList.toggle("light");
    localStorage.setItem(
        "theme",
        bodyEl.classList.contains("dark")?"dark":"light"
    );
};
</script>

</body>
</html>
