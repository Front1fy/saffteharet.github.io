<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>saffteharet</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
*{box-sizing:border-box;}
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f4fbff;
    color:#222;
    transition:.3s;
}
body.light{background:#f4fbff;color:#222;}
body.dark{
    background:linear-gradient(135deg,#0a1a3b,#13264f,#1b3270);
    color:#fff;
}

/* HEADER */
.header{
    background:#2fa4aa;
    height:120px;
    border-bottom-left-radius:60% 35px;
    border-bottom-right-radius:70% 35px;
    position:relative;
    display:flex;
    align-items:center;
    padding:0 20px;
}

/* THEME */
.theme-toggle{
    width:40px;height:40px;border-radius:50%;
    background:rgba(255,255,255,.25);
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
}
.theme-toggle i{color:#fff;font-size:18px;position:absolute;}
#moonIcon,#sunIcon{display:none;}
body.light #sunIcon{display:block;}
body.dark #moonIcon{display:block;}

/* LOGO */
.logo{
    width:100px;height:100px;
    background:#fff;border-radius:50%;
    position:absolute;
    left:50%;top:45px;
    transform:translateX(-50%);
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 10px 25px rgba(0,0,0,.25);
}
.logo img{width:110%;height:110%;object-fit:cover}

/* LANG */
.lang-btn{
    position:absolute;right:25px;top:42px;
    width:35px;height:35px;
}
.lang-btn img{
    width:100%;height:100%;
    border-radius:50%;
}

/* ONLY MENU BUTTON */
.menu-area{
    height:calc(100vh - 120px);
    display:flex;
    align-items:center;
    justify-content:center;
}
.menu-btn{
    background:#2fa4aa;
    color:#fff;
    text-decoration:none;
    padding:18px 36px;
    border-radius:40px;
    font-size:18px;
    font-weight:bold;
    box-shadow:0 10px 25px rgba(0,0,0,.3);
    transition:.3s;
}
.menu-btn:hover{
    transform:translateY(-3px);
    background:#249398;
}
</style>
</head>

<body class="light">

<div class="header">
    <div class="theme-toggle" id="themeToggle">
        <i class="fas fa-moon" id="moonIcon"></i>
        <i class="fas fa-sun" id="sunIcon"></i>
    </div>

    <div class="logo">
        <img src="ımg/WhatsApp Image 2026-02-07 at 16.54.11.jpeg">
    </div>

    <div class="lang-btn">
        <img src="ımg/images.png">
    </div>
</div>

<!-- SADECE BUTTON -->
<div class="menu-area">
    <a href="index2.html" class="menu-btn">
        🍽 Menyulara baxın
    </a>
</div>

<script>
const toggle=document.getElementById("themeToggle");
const bodyEl=document.body;

if(localStorage.getItem("theme")==="dark"){
    bodyEl.classList.replace("light","dark");
}

toggle.onclick=()=>{
    bodyEl.classList.toggle("dark");
    bodyEl.classList.toggle("light");
    localStorage.setItem(
        "theme",
        bodyEl.classList.contains("dark")?"dark":"light"
    );
};
</script>

</body>
</html>
