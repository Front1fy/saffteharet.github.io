<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Saff Təharet</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
    font-family:Arial,sans-serif;
    background:#f4fbff;
    color:#222;
}

/* HEADER */
.header{
    background:#2fa4aa;
    height:160px;
    border-bottom-left-radius:60% 40px;
    border-bottom-right-radius:70% 40px;
    position:relative;
}

/* LOGO */
.logo-box{
    position:absolute;
    left:50%;
    top:70px;
    transform:translateX(-50%);
    width:120px;
    height:120px;
}

.logo{
    width:100px;
    height:100px;
    background:#fff;
    border-radius:50%;
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    display:flex;
    align-items:center;
    justify-content:center;
    box-shadow:0 10px 25px rgba(0,0,0,.25);
    z-index:2;
}
.logo img{
    width:110%;
    height:110%;
    object-fit:cover;
    border-radius:50%;
}

/* CURVED TEXT */
.curved-text{
    position:absolute;
    inset:0;
}

.curved-text text{
    fill:#4dffd2;
    font-size:18px;
    font-weight:700;
    letter-spacing:4px;
    animation:neonGlow 1.8s infinite alternate;
}

@keyframes neonGlow{
    from{
        filter:drop-shadow(0 0 5px #4dffd2)
               drop-shadow(0 0 12px rgba(77,255,210,.6));
        opacity:.85;
    }
    to{
        filter:drop-shadow(0 0 10px #4dffd2)
               drop-shadow(0 0 22px rgba(77,255,210,.9));
        opacity:1;
    }
}

/* CONTENT */
.main{
    margin-top:110px;
    text-align:center;
    padding:20px;
}

/* STARS */
.stars{
    margin:10px 0 4px;
}
.stars i{
    color:#ffd700;
    font-size:20px;
    animation:twinkle 1.5s infinite alternate;
}
@keyframes twinkle{
    from{filter:drop-shadow(0 0 2px #ffd700)}
    to{filter:drop-shadow(0 0 10px #ffd700)}
}

.rating{
    font-size:14px;
    margin-bottom:14px;
}

/* MENU BUTTON */
.menu-btn{
    display:inline-flex;
    align-items:center;
    gap:10px;
    padding:14px 26px;
    background:#2fa4aa;
    color:#fff;
    text-decoration:none;
    font-size:18px;
    border-radius:30px;
    box-shadow:0 10px 20px rgba(0,0,0,.2);
    animation:floatBtn 2.5s infinite;
}
.menu-btn i{
    font-size:20px;
}

@keyframes floatBtn{
    0%{transform:translateY(0)}
    50%{transform:translateY(-8px)}
    100%{transform:translateY(0)}
}

/* INFO BOX */
.info-box{
    margin:25px auto;
    max-width:420px;
    background:#fff;
    padding:18px;
    border-radius:16px;
    box-shadow:0 8px 22px rgba(0,0,0,.15);
    font-size:15px;
    line-height:1.5;
}

/* SOCIAL */
.social{
    margin-top:12px;
    display:flex;
    justify-content:center;
    gap:18px;
}
.social a{
    width:44px;
    height:44px;
    border-radius:50%;
    background:#2fa4aa;
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:22px;
    transition:.3s;
}
.social a:hover{
    transform:scale(1.15);
    box-shadow:0 0 15px rgba(47,164,170,.8);
}
</style>
</head>

<body>

<div class="header">
    <div class="logo-box">

        <!-- CURVED TEXT -->
        <svg class="curved-text" viewBox="0 0 200 200">
            <path id="circlePath"
                  d="M100,100 m-75,0 a75,75 0 1,1 150,0 a75,75 0 1,1 -150,0"
                  fill="none"/>
            <text>
                <textPath href="#circlePath" startOffset="50%" text-anchor="middle">
                    SAFF TƏHARET
                </textPath>
            </text>
        </svg>

        <!-- LOGO -->
        <div class="logo">
            <img src="img/logo.jpg" alt="Saff Təharet">
        </div>

    </div>
</div>

<div class="main">

    <!-- STARS -->
    <div class="stars">
        <i class="fas fa-star"></i>
        <i class="fas fa-star"></i>
        <i class="fas fa-star"></i>
        <i class="fas fa-star"></i>
        <i class="fas fa-star"></i>
    </div>

    <div class="rating">
        <strong>4.8</strong> ortalama reytinq • <strong>325</strong> rəy
    </div>

    <!-- MENU BUTTON -->
    <a href="index2.html" class="menu-btn">
        <i class="fas fa-broom"></i> Menyulara baxın
    </a>

    <!-- INFO -->
    <div class="info-box">
        Saff Təharet — yüksək keyfiyyətli təmizlik məhsullarının
        satışını həyata keçirən etibarlı şirkətdir.
        Məqsədimiz eviniz və iş yeriniz üçün maksimum
        təmizlik və sağlamlıq təmin etməkdir.

        <div class="social">
            <a href="https://wa.me/994000000000" target="_blank"><i class="fab fa-whatsapp"></i></a>
            <a href="https://instagram.com" target="_blank"><i class="fab fa-instagram"></i></a>
            <a href="https://tiktok.com" target="_blank"><i class="fab fa-tiktok"></i></a>
        </div>
    </div>

</div>

</body>
</html>
